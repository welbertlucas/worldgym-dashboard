<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Gym Atlas</title>
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preload" as="image" href="%BASE_URL%globo-wg.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@700;800&family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      .abertura{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:#fff;background:radial-gradient(130% 90% at 30% 115%,#21398A 0%,#152A6A 26%,#0C1A4C 52%,#061030 76%,#030819 100%);font-family:Cinzel,serif;text-transform:uppercase;line-height:1;text-align:center}
      .abertura-globo{background:#fff;opacity:.95;-webkit-mask:url(%BASE_URL%globo-wg.png) center/contain no-repeat;mask:url(%BASE_URL%globo-wg.png) center/contain no-repeat}
      .abertura-mundo{display:block;font-size:13px;font-weight:500;letter-spacing:.42em;color:rgba(255,255,255,.8)}
      .abertura-atlas{display:block;margin-top:8px;font-size:34px;font-weight:700;letter-spacing:.12em}
      html[data-claro] .abertura{color:#14181F;background:radial-gradient(120% 90% at 50% 0%,#FFFFFF 0%,#FAFAFB 60%,#F3F4F6 100%)}
      html[data-claro] .abertura-globo{background:#C41230}
      html[data-claro] .abertura-mundo{color:#6B7078}
    </style>
    <script src="%BASE_URL%splash.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- Abertura antes do app carregar (o React troca pelo componente Abertura, que é igual). Azul para quem vai ao login, clara para quem já tem sessão. -->
      <div class="abertura">
        <div class="abertura-globo" style="width:140px;height:140px"></div>
        <p style="margin:0"><span class="abertura-mundo">World Gym</span><span class="abertura-atlas">Atlas</span></p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
