name: Atualizar indicadores do EVO

# Lê o EVO (só leitura) e grava os totais mensais por unidade no Blob da Vercel.
# Recalcula o mês anterior e o atual (títulos de um mês ainda mudam depois de fechado).
# Também pode ser rodado à mão, informando os meses (ex.: 2026-09,2026-10).

on:
  schedule:
    # Quem dispara no horário é o despertador da Vercel (vercel.json -> /api/despertador), às 00:37 de Brasília: o agendador do
    # GitHub atrasa de 8 a 10 horas (novembro/2026). Este horário fica só de reserva: se o despertador já rodou hoje, ele pula.
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      months:
        description: "Meses AAAA-MM separados por vírgula (vazio = mês anterior e atual)"
        required: false

permissions:
  contents: read

concurrency:
  group: evo-sync
  cancel-in-progress: false

jobs:
  # A execução agendada do GitHub chega horas atrasada. Se o despertador (ou alguém, à mão) já rodou hoje com sucesso, ou
  # ainda está rodando, ela não carrega o EVO de novo no meio do dia.
  verificar:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      pular: ${{ steps.v.outputs.pular }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          pular=false
          if [ "$EVENTO" = "schedule" ]; then
            hoje="$(TZ=America/Sao_Paulo date +%F)"
            n="$(gh run list -R "$GITHUB_REPOSITORY" --workflow evo-sync.yml --event workflow_dispatch --limit 20 \
              --json createdAt,status,conclusion \
              --jq "[.[] | select(.conclusion == \"success\" or .status != \"completed\") | select((.createdAt | fromdateiso8601) - 10800 | strftime(\"%Y-%m-%d\") == \"$hoje\")] | length")"
            if [ "$n" -gt 0 ]; then pular=true; echo "Já rodou hoje ($hoje) pelo despertador ou à mão: pulando."; fi
          fi
          echo "pular=$pular" >> "$GITHUB_OUTPUT"

  sync:
    needs: verificar
    if: needs.verificar.outputs.pular != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Meses a calcular
        env:
          MONTHS: ${{ github.event.inputs.months }}
        run: |
          if [ -z "$MONTHS" ]; then
            MONTHS="$(date -u -d 'last month' +%Y-%m) $(date -u +%Y-%m)"
          else
            MONTHS="${MONTHS//,/ }"
          fi
          echo "MONTHS_DONE=$MONTHS" >> "$GITHUB_ENV"
      # Daqui em diante, cada etapa roda mesmo que uma anterior tenha falhado (if: !cancelled()): uma queda do EVO numa
      # parte não impede as outras, e a consolidação no fim sempre publica no painel o que deu certo. A execução continua
      # marcada como falha no GitHub para a gente ver o que faltou.
      - name: Calcular e gravar
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-backfill.mjs $MONTHS_DONE
      - if: ${{ !cancelled() }}
        name: Alunos ativos, renovação e onde moram (uma leitura dos alunos para tudo)
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-alunos.mjs $MONTHS_DONE
      - if: ${{ !cancelled() }}
        name: NPS por unidade (WeHelp)
        # Não derruba a sincronização do EVO se o WeHelp estiver fora do ar ou sem as credenciais cadastradas.
        continue-on-error: true
        env:
          WEHELP_CLIENT_ID: ${{ secrets.WEHELP_CLIENT_ID }}
          WEHELP_CLIENT_SECRET: ${{ secrets.WEHELP_CLIENT_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/wehelp-nps.mjs $MONTHS_DONE
      - if: ${{ !cancelled() }}
        name: Motivos de cancelamento
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-cancelamentos.mjs $MONTHS_DONE
      - if: ${{ !cancelled() }}
        name: Cobranças com falha e motivos de recusa
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-cobrancas.mjs $MONTHS_DONE
      - if: ${{ !cancelled() }}
        name: Conversão de cadastros (prospects do EVO)
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-prospects.mjs $MONTHS_DONE
      - if: ${{ !cancelled() }}
        name: Perfil das oportunidades (gênero e idade)
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-perfil-oportunidades.mjs $MONTHS_DONE
      - if: ${{ !cancelled() }}
        name: Vendas do mês (novos contratos, vendas online, avulsas, planos e produtos mais vendidos)
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-vendas.mjs $MONTHS_DONE
      - if: ${{ !cancelled() }}
        name: Entradas na catraca (mapa de calor dia × hora e liberações manuais)
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-entradas.mjs $MONTHS_DONE
      - if: ${{ !cancelled() }}
        name: Recebimento por forma de pagamento e notas fiscais
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-formas-pagamento.mjs $MONTHS_DONE
      - if: ${{ !cancelled() }}
        name: Consolidar os meses num arquivo só (o painel lê só este)
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-consolidar.mjs
