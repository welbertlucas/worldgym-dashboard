name: Atualizar indicadores do EVO

# Lê o EVO (só leitura) e grava os totais mensais por unidade no Blob da Vercel.
# Recalcula o mês anterior e o atual (títulos de um mês ainda mudam depois de fechado).
# Também pode ser rodado à mão, informando os meses (ex.: 2026-09,2026-10).

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      months:
        description: "Meses AAAA-MM separados por vírgula (vazio = mês anterior e atual)"
        required: false

permissions:
  contents: read

concurrency:
  group: evo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Calcular e gravar
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          MONTHS: ${{ github.event.inputs.months }}
        run: |
          if [ -z "$MONTHS" ]; then
            MONTHS="$(date -u -d 'last month' +%Y-%m) $(date -u +%Y-%m)"
          else
            MONTHS="${MONTHS//,/ }"
          fi
          node scripts/evo-backfill.mjs $MONTHS
          echo "MONTHS_DONE=$MONTHS" >> "$GITHUB_ENV"
      - name: Alunos ativos no fim do mês (ticket médio e adimplentes)
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-ativos.mjs $MONTHS_DONE
      - name: NPS por unidade (WeHelp)
        # Não derruba a sincronização do EVO se o WeHelp estiver fora do ar ou sem as credenciais cadastradas.
        continue-on-error: true
        env:
          WEHELP_CLIENT_ID: ${{ secrets.WEHELP_CLIENT_ID }}
          WEHELP_CLIENT_SECRET: ${{ secrets.WEHELP_CLIENT_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/wehelp-nps.mjs $MONTHS_DONE
      - name: Motivos de cancelamento
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-cancelamentos.mjs $MONTHS_DONE
      - name: Cobranças com falha e motivos de recusa
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-cobrancas.mjs $MONTHS_DONE
      - name: Situação dos treinos (foto de hoje)
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-treinos.mjs
      - name: Onde moram os alunos (bairros, foto de hoje)
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-bairros.mjs
      - name: Conversão de cadastros (prospects do EVO)
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-prospects.mjs $MONTHS_DONE
      - name: Vendas do mês (novos contratos, vendas online, avulsas)
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-vendas.mjs $MONTHS_DONE
      - name: Contratos ativos, especiais/VIP e personal (mês corrente)
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-contratos.mjs
      - name: Consolidar os meses num arquivo só (o painel lê só este)
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-consolidar.mjs
