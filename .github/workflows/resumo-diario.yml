name: Resumo diário por e-mail

# Envia a cada acesso ativo o resumo das unidades dele, às 06:47 de Brasília (09:47 UTC). Quem dispara no horário é o
# despertador da Vercel (vercel.json -> /api/despertador); o agendamento abaixo fica de reserva, porque o do GitHub atrasa
# de 8 a 10 horas. Rodar duas vezes não duplica e-mail: quem já recebeu o resumo do dia fica de fora.
on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resumo-diario
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Enviar resumos
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESUMO_REMETENTE: ${{ secrets.RESUMO_REMETENTE }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/resumo-diario.mjs
