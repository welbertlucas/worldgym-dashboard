name: Recarga do histórico (EVO)

# Só à mão: regrava UMA informação nos meses informados, sem recalcular mais nada, e consolida para o painel.
#   alunos    -> suspensos (contrato trancado), cancelamentos por gênero e faixa de idade e saldo devedor no fim de cada mês
#   entradas  -> entradas na catraca (mapa de calor), liberações manuais (motivo e grupo) e quem treina em outra unidade
#                (lê antes os alunos de todas as unidades para o mapa de origem: cerca de 1 hora a mais)
#   pagamentos -> formas de pagamento, bandeiras e gateways do cartão e as notas fiscais (com a cobertura do recebido)
#   vendas    -> tudo o que vem das vendas (novos contratos, avulsas, planos mais vendidos) e as vendas por dia do mês
# Usa a mesma fila do evo-sync para nunca gravar os meses ao mesmo tempo que ele.

on:
  workflow_dispatch:
    inputs:
      etapa:
        description: "O que recarregar"
        type: choice
        options: [alunos, entradas, vendas, pagamentos]
        default: alunos
      months:
        description: "Meses AAAA-MM separados por vírgula, ou um intervalo AAAA-MM..AAAA-MM"
        required: true

permissions:
  contents: read

concurrency:
  group: evo-sync
  cancel-in-progress: false

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Meses
        env:
          MONTHS: ${{ github.event.inputs.months }}
        run: |
          if [[ "$MONTHS" == *..* ]]; then
            ini="${MONTHS%%..*}"; fim="${MONTHS##*..}"; lista=""; m="$ini"
            while [[ "$m" < "$fim" || "$m" == "$fim" ]]; do lista="$lista $m"; m="$(date -u -d "$m-01 +1 month" +%Y-%m)"; done
            MONTHS="$lista"
          else
            MONTHS="${MONTHS//,/ }"
          fi
          echo "Meses:$MONTHS"
          echo "MONTHS_DONE=$MONTHS" >> "$GITHUB_ENV"
      - name: Suspensos e cancelamentos por perfil
        if: ${{ github.event.inputs.etapa == 'alunos' }}
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-alunos-historico.mjs $MONTHS_DONE
      - name: Entradas na catraca, liberações manuais e quem treina em outra unidade
        if: ${{ github.event.inputs.etapa == 'entradas' }}
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          MAPA_ORIGEM: ${{ runner.temp }}/origem-alunos.json
        run: |
          node scripts/evo-origem.mjs
          node scripts/evo-entradas.mjs $MONTHS_DONE
      - name: Vendas do mês e vendas por dia
        if: ${{ github.event.inputs.etapa == 'vendas' }}
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-vendas.mjs $MONTHS_DONE
      - name: Formas de pagamento e notas fiscais
        if: ${{ github.event.inputs.etapa == 'pagamentos' }}
        env:
          EVO_DNS: ${{ secrets.EVO_DNS }}
          EVO_TOKEN: ${{ secrets.EVO_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-formas-pagamento.mjs $MONTHS_DONE
      - name: Consolidar os meses num arquivo só (o painel lê só este)
        if: ${{ !cancelled() }}
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/evo-consolidar.mjs
