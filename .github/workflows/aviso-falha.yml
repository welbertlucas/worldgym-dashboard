name: Aviso de falha das rotinas

# Quando uma rotina automática termina com falha (ou estoura o tempo), manda um e-mail curto para o dono.
# Rodadas canceladas (uma nova substituiu a anterior) não geram aviso.
on:
  workflow_run:
    workflows:
      - Atualizar indicadores do EVO
      - Resumo diário por e-mail
      - Backup dos usuários
      - Atualizar campanhas do Meta
      - Atualizar Instagram das unidades
      - Atualizar jurídico
      - Deploy para GitHub Pages
    types: [completed]

permissions:
  contents: read

jobs:
  avisar:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Avisar o dono
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESUMO_REMETENTE: ${{ secrets.RESUMO_REMETENTE }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          ROTINA: ${{ github.event.workflow_run.name }}
          CONCLUSAO: ${{ github.event.workflow_run.conclusion }}
          LINK: ${{ github.event.workflow_run.html_url }}
          INICIO: ${{ github.event.workflow_run.run_started_at }}
          RODADA: ${{ github.event.workflow_run.id }}
        run: node scripts/aviso-falha.mjs
